ont-size="11" font-weight="400" fill="#777777" text-anchor="start">包装外形为示意，后续替换为真实产品图</text><text x="672" y="1057.24" font-family="PingFang SC,Microsoft YaHei,Arial Unicode MS,sans-serif" font-size="11" font-weight="400" fill="#777777" text-anchor="end">03B</text></svg>