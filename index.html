  }
  function projectTabBody(p, tab) {
    if(p.slug === 'sales-content' && tab === 'assets') return salesAssets(p);
    if(tab === 'strategy') return `<section class="tab-content strategy-content"><div class="body-intro"><small>CONTENT STRATEGY</small><h2>内容从哪里<span>开始？</span></h2><p>围绕项目目标和具体问题，梳理更适合产品与渠道的传播方式。</p></div><div class="strategy-stack">${p.strategies.map(s=>`<article class="strategy-card"><span class="strategy-index">${esc(s.index)}</span><div><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></div><span class="strategy-dash">↗</span></article>`).join('')}</div></section>`;
    if(tab === 'assets') return `<section class="tab-content"><div class="body-intro"><small>SELECTED DELIVERABLES</small><h2>从策略到<span>具体作品。</span></h2><p>精选产品海报、详情页与公众号内容。点击图片可放大查看；本人负责内容策划与文案，视觉由团队协作完成。</p></div><div class="gallery-grid">${p.media.map((m,i)=>`<button class="gallery-tile ${i===0?'gallery-first':''}" data-zoom-src="${assetSrc(m.src)}" data-zoom-name="${esc(p.name+' · '+m.label)}" type="button"><div class="gallery-image cover-${esc(p.theme)} ${m.original?'gallery-original':''}"><span class="gallery-pending">${esc(m.label)}<small>作品预览</small></span><img class="gallery-photo" src="${assetSrc(m.src)}" alt="${esc(m.label)}" ${m.width?`width="${m.width}" height="${m.height}"`:''} loading="lazy" /></div><div class="gallery-foot"><b>${esc(m.label)}</b><span>${esc(m.desc)}</span></div></button>`).join('')}</div>${p.article?`<p><a class="text-link" href="${esc(p.article)}" target="_blank" rel="noopener noreferrer">阅读${esc(p.name)}公众号原文 ↗</a></p>`:''}<div class="assets-tags"><span>相关内容交付</span>${p.outputs.map(o=>`<em>${esc(o)}</em>`).join('')}</div></section>`;
    if(tab === 'outcome') return `<section class="tab-content outcome-content"><div class="body-intro"><small>OUTCOME & REFLECTION</small><h2>项目结果<span>与总结。</span></h2></div><div class="outcome-layout"><div class="outcome-stat"><small>PROJECT RESULT</small><strong>${esc(p.metric)}</strong><span>${esc(p.metricLabel)}</span></div><div class="outcome-copy"><h3>这次项目，我完成了什么？</h3><p>${esc(p.summary)}</p><div class="metric-caution"><span>ⓘ</span><p>${esc(p.metricNote)}</p></div></div></div><div class="outcome-close">CONTENT STRATEGY <span>×</span> EXECUTION</div></section>`;
    return `<section class="tab-content overview-content"><div class="overview-grid"><article class="overview-card"><small>01 / THE CHALLENGE</small><h2>项目问题</h2><p>${esc(p.challenge)}</p></article><article class="overview-card"><small>02 / MY ROLE</small><h2>我的职责</h2><p>${esc(p.roleDetails)}</p></article></div><div class="overview-deliverables"><div><small>CONTENT SCOPE</small><h3>我的工作覆盖哪些内容？</h3></div><div class="pill-list">${p.outputs.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div><div class="overview-next"><span>了解思考过程，而不仅看成果</span><a href="${routeProject(p,'strategy')}">继续查看内容策略 ↗</a></div></section>`;

      <section class="project-top"><div class="project-copy"><span class="overline">${esc(p.category==='beauty'?'PRODUCT CONTENT':'BRAND & SOCIAL')} / ${esc(p.years)}</span><p class="project-role">${esc(p.role)}</p><h1>${esc(p.name)}</h1><p class="project-headline">${esc(p.title)}</p><p class="project-description">${esc(p.lead)}</p><div class="project-facts"><div><small>PROJECT OUTCOME</small><strong>${esc(p.metric)}</strong><span>${esc(p.metricLabel)}</span></div><a href="${routeProject(p,'outcome')}">查看项目结果 ↗</a></div></div>${placeholder(p,p.coverSrc || p.media[0]?.src,'project-cover')}</section>

      <div class="next-project"><span>NEXT CASE / 下一个项目</span><a href="${routeProject(next)}">${esc(next.name)} ↗</a></div>
    </div>`;

  function libCard(item) {
    return `<button type="button" class="lib-tile" data-library-id="${esc(item.id)}"><div class="lib-art lib-${esc(item.category)} ${item.original?'lib-original':''}"><div class="lib-art-deco"><span>${esc(item.eyebrow || 'CONTENT / WORK')}</span><strong>${esc(item.title)}</strong><em>${item.category==='video'?'▶':item.category==='script'?'Aa':'✳'}</em></div>${item.poster ? `<img class="lib-img" src="${assetSrc(item.poster)}" loading="lazy" alt="${esc(item.title)}作品封面" />` : ''}</div><div class="lib-info"><span>${esc(item.status)}</span><b>${esc(item.title)}</b><p>${esc(item.subtitle)}</p><span class="lib-arrow">↗</span></div></button>`;

  }
  function renderAbout(){return `<div class="about-page page-fade"><div class="page-head"><span class="overline">ABOUT / 03</span><h1>关于<span>我。</span></h1><p>擅长把复杂的产品信息整理成用户听得懂、业务用得上的内容表达。</p></div><div class="about-columns"><section class="about-summary"><small>HELLO, I’M YANPING</small><h2>从互联网品牌传播，<br>到美妆产品内容。</h2><p>经历覆盖新媒体运营、活动传播与护肤品新品内容策划。近年负责精华油、童颜面膜、防晒及洁面等产品的卖点梳理和多渠道内容落地，曾参与酷狗音乐官方新媒体运营及重点项目传播。</p><div class="about-skills"><span>产品卖点提炼</span><span>新品内容策划</span><span>私域种草</span><span>明星 / 达人脚本</span><span>新媒体运营</span><span>跨部门协同</span></div><a class="action-primary" href="mailto:beibiduo@163.com">发送邮件联系我 ↗</a><p><a class="text-link" href="portfolio-resume.pdf" target="_blank" rel="noopener">查看 / 下载完整简历 ↗</a><br>beibiduo@163.com · 求职城市：广州</p></section><section class="about-timeline"><small>EXPERIENCE / 经历</small>${[['2024.03 — 2026.09','广州无添加主义化妆品有限公司','企划（产品内容方向）'],['2019.06 — 2024.01','广州酷狗计算机科技有限公司','新媒体运营经理'],['2018.02 — 2019.04','China Marketing Development Center · 首尔','新媒体运营'],['2017.01 — 2018.01','上海沪江网教育技术有限公司','新媒体编辑']].map(([date,co,role])=>`<div class="timeline-row"><span>${date}</span><div><h3>${co}</h3><p>${role}</p></div></div>`).join('')}<div class="about-edu"><span>釜山大学 · 硕士</span><span>韩国语 TOPIK 6 级</span></div></section></div></div>`}

    $$('img.lib-img',dialog).forEach(img=>fixImage(img));
    const video=$('video',dialog);
    if(video){let notice=$('.video-notice',dialog); const missing=()=>{video.hidden=true;notice.hidden=false};video.addEventListener('error',missing);$('source',video)?.addEventListener('error',missing)}
    if(!dialog.open)dialog.showModal();
  }
  function fixImage(img){
    const show=()=>{img.classList.add('image-ready');img.closest('.cover, .gallery-image, .lib-art,.modal-art')?.classList.add('has-image')};
    const fail=()=>{img.hidden=true;img.classList.remove('image-ready')};
    img.addEventListener('load', show, {once:true});img.addEventListener('error', fail, {once:true});
    if(img.complete){if(img.naturalWidth)show();else fail()}
  }
  function setActiveNav(type,slug){$$('.side-link').forEach(a=>{const active=type==='project'?a.dataset.project===slug:a.dataset.route===type;a.classList.toggle('is-active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}

  function render(){
    const hash=decodeURIComponent(location.hash||'#/home'); const parts=hash.replace(/^#\/?/,'').split('/'); const type=parts[0]||'home';
    const p=type==='project' ? projects.find(x=>x.slug===parts[1]) : null;
    const tab=p && tabs.some(x=>x[0]===parts[2])?parts[2]:'overview';
    const libFilter=['all','video','script','editorial'].includes(parts[1])?parts[1]:'all';

    $('#pageLocation').textContent=`SUN YANPING / ${name}`;
    $('#appView').innerHTML=html;
    $$('#appView img.cover-image, #appView img.gallery-photo, #appView img.lib-img').forEach(fixImage);
    setActiveNav(activeType,p?.slug);
    document.title=`${name} · 孙岩萍内容营销作品集`;
    // Only the content pane scrolls; navigating sections always starts at its first fold.
    const pane=$('#appMain'); if(currentRoute!==hash)pane.scrollTop=0;
    currentRoute=hash; closeMenu();
  }
  document.addEventListener('click',e=>{
    const lib=e.target.closest('[data-library-id]');if(lib){openWork(lib.dataset.libraryId);return;}
    const tile=e.target.closest('[data-zoom-src]');if(tile){const img=$('.gallery-photo',tile);if(!img||!img.naturalWidth)return;$('#lightboxImage').src=img.currentSrc||img.src;$('#lightboxCaption').textContent=tile.dataset.zoomName;$('#imageDialog').showModal();return;}
    const tab=e.target.closest('[role="tab"]'); if(tab && tab.getAttribute('href')===location.hash) e.preventDefault();

  $$('dialog').forEach(d=>{
    d.addEventListener('click',e=>{if(e.target===d)d.close()});
    d.addEventListener('close',()=>$$('video',d).forEach(v=>v.pause()));
  });
  $('#menuToggle').addEventListener('click',()=>{const open=!document.body.classList.contains('sidebar-open');document.body.classList.toggle('sidebar-open',open);$('#menuToggle').setAttribute('aria-expanded',String(open));$('#menuShade').hidden=!open;});
  $('#menuShade').addEventListener('click',closeMenu);

  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu(); if(['ArrowLeft','ArrowRight'].includes(e.key) && document.activeElement?.getAttribute('role')==='tab'){e.preventDefault();const el=document.activeElement;const list=$$('[role="tab"]');const i=list.indexOf(el);const next=list[(i+(e.key==='ArrowRight'?1:-1)+list.length)%list.length];next?.focus();location.hash=next.getAttribute('href');}});
  window.addEventListener('hashchange',render);
  navMarkup();render();
