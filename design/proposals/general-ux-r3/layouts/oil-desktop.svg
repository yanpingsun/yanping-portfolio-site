<text x="248" y="190" font-family="Noto Serif SC,Songti SC,serif" font-size="22" font-weight="500" fill="#26382f">日夜精华油</text>
<text x="248" y="256" font-family="Noto Serif SC,Songti SC,serif" font-size="42" font-weight="600" fill="#26382f">把共同特点，</text>
<text x="248" y="317" font-family="Noto Serif SC,Songti SC,serif" font-size="42" font-weight="600" fill="#26382f">写进日夜场景</text>
<text x="248" y="378" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">两瓶精华油既要有共同的记忆点，也要让人看懂日用、夜用</text>
<text x="248" y="410" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">各自的角色。我负责把产品资料写成主张、图文和不同讲述</text>
<text x="248" y="442" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">方式。</text>
<text x="248" y="492" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#46534a">我的工作：卖点与文案、内容结构、四条视频脚本。 既定产品方案</text>
<text x="248" y="520" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#46534a">由相关团队确定；视觉设计、包装、拍摄剪辑及商务由协作团队负</text>
<text x="248" y="548" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#46534a">责。</text>
<text x="248" y="596" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">项目整体结果：产品／套组上市两周，私域 GMV 460万+，由团队</text>
<text x="248" y="624" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">及渠道共同完成。</text>
<image href="../../../../portfolio-content/essence-oil/assets/posters/oil-product.png" x="761.14" y="168" width="455" height="418" preserveAspectRatio="xMidYMid meet"/>
<text x="761.28" y="612" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#626c62">日夜精华油代表作品</text>
<text x="761.28" y="640" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#a65336">查看原图 ↗</text>
<path d="M248,748 L1216,748" stroke="#cdd2c7"/>
<text x="248" y="805" font-family="Noto Serif SC,Songti SC,serif" font-size="30" font-weight="600" fill="#26382f">先把共同特点，写成一句能记住的话</text>
<text x="248" y="879" font-family="Noto Serif SC,Songti SC,serif" font-size="39" font-weight="600" fill="#26382f">原作主张：“表补油，里补精华”。</text>
<text x="248" y="938" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">我将精华与油相的产品特点压缩成一句对称短句，让标题、短图文和口播有共同的表达。具体说</text>
<text x="248" y="970" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">明再回到产品信息，继续解释这句话指向哪些特点。</text>
<text x="248" y="1022" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">介绍从干燥、紧绷、上妆卡粉等护理困扰进入，以“保护层”的类比解释皮脂膜，再转到产品。</text>
<text x="248" y="1054" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">先给理解入口，后面的成分与日夜区别才有共同背景。</text>
<path d="M248,1118 L1216,1118" stroke="#cdd2c7"/>
<text x="248" y="1175" font-family="Noto Serif SC,Songti SC,serif" font-size="30" font-weight="600" fill="#26382f">让日夜各有角色，也保留系列感</text>
<text x="248" y="1228" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">海报文案和内容层级由我负责，设计师完成视觉制作。以下使用本人补充提供的简版内容排版线</text>
<text x="248" y="1260" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">稿，与历史成品对照。</text>
<text x="248" y="1336" font-family="Noto Serif SC,Songti SC,serif" font-size="22" font-weight="600" fill="#26382f">日间透亮：把重点放在日间护理与妆前</text>
<text x="248" y="1385" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">以“智能抗氧盾”“祛黄提亮”“妆前打底”三组历史标签选择说明，围绕日间场景展开。线稿</text>
<text x="248" y="1417" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">先明确主张与卖点的优先级，成品再通过字号、位置和产品画面完成视觉表达。</text>
