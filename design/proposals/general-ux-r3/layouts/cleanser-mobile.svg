<text x="308" y="126" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#a65336">目录</text>
<path d="M348,120 L353,125" stroke="#a65336"/>
<path d="M353,125 L358,120" stroke="#a65336"/>
<path d="M0,144 L390,144" stroke="#cdd2c7"/>
<text x="20" y="186" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#26382f">逆时光洁颜霜</text>
<text x="20" y="235" font-family="Noto Serif SC,Songti SC,serif" font-size="29" font-weight="600" fill="#26382f">一句话回应两种使用顾虑</text>
<text x="20" y="285" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">我的工作：独立完成卖点提炼、整体内容策划与</text>
<text x="20" y="313" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">文案。 配方、研发与测试来自产品资料；摄影和</text>
<text x="20" y="341" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">视觉设计未计入个人已确认职责。</text>
<image href="../../../../portfolio-content/cleanser/assets/posters/cleanser-main.jpg" x="89.0" y="373" width="212" height="340" preserveAspectRatio="xMidYMid meet"/>
<text x="20" y="739" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#626c62">洁颜霜主海报：历史短文案作品</text>
<text x="20" y="767" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#a65336">查看原图 ↗</text>
<text x="20" y="837" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">项目整体结果：洁面上新 GMV 80万+，由项目及</text>
<text x="20" y="865" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">渠道共同完成；统计时长尚未补充。</text>
<text x="20" y="914" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">洗不净和洗后紧绷，是这款洁面内容需要同时</text>
<text x="20" y="944" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">回应的两类顾虑。我把产品资料整理成短主</text>
<text x="20" y="974" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">张，再通过海报和上新文章分别展开。</text>
<path d="M20,1057 L370,1057" stroke="#cdd2c7"/>
<text x="20" y="1109" font-family="Noto Serif SC,Songti SC,serif" font-size="25" font-weight="600" fill="#26382f">先把两类顾虑，写进一句短话</text>
<text x="20" y="1158" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="400" fill="#26382f">历史原作：</text>
<text x="20" y="1206" font-family="Noto Serif SC,Songti SC,serif" font-size="28" font-weight="600" fill="#26382f">“油皮洗得净，</text>
<text x="20" y="1252" font-family="Noto Serif SC,Songti SC,serif" font-size="28" font-weight="600" fill="#26382f">干皮不紧绷”。</text>
<text x="20" y="1311" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">“洗得净”回答清洁是否足够，“不紧绷”回</text>
<text x="20" y="1341" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">答洗后感受。两个相互呼应的分句，把容易分</text>
<text x="20" y="1371" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">散在资料里的关注点放到同一主张中，读者先</text>
<text x="20" y="1401" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">知道这款产品想回应什么。</text>
<text x="20" y="1451" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">主海报围绕这句话安排标题与产品，不再把其</text>
<text x="20" y="1481" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">他成分说明都挤进首个画面。下面是本人补充</text>
<text x="20" y="1511" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">提供的简版内容排版线稿及历史成品，视觉由</text>
<text x="20" y="1541" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">设计师完成。</text>
<rect x="20" y="1574" width="350" height="450" fill="#fff" stroke="#cdd2c7"/>
