<image href="../../../../portfolio-content/skincare-wireframes/cleanser/core-finished.jpg" x="61.0" y="2128" width="268" height="430" preserveAspectRatio="xMidYMid meet"/>
<text x="20" y="2594" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#626c62">核心主张：历史海报成品</text>
<text x="20" y="2622" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#a65336">查看原图 ↗</text>
<text x="20" y="2693" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#a65336">查看主海报原件</text>
<path d="M20,2757 L370,2757" stroke="#cdd2c7"/>
<text x="20" y="2809" font-family="Noto Serif SC,Songti SC,serif" font-size="25" font-weight="600" fill="#26382f">短句留下重点，长文继续解释</text>
<text x="20" y="2859" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">2024年7月11日的上新文章，以“可以睁眼</text>
<text x="20" y="2889" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">洗”的历史传播表达建立温和性记忆，再解释</text>
<text x="20" y="2919" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">配方、洗卸与清洁信息、使用感受和首发选</text>
<text x="20" y="2949" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">择。</text>
<text x="20" y="2999" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">海报给出简短理由，长文则需要继续回答“温</text>
<text x="20" y="3029" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">和是否也能洗干净”。正文通过设问和转场展</text>
<text x="20" y="3059" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">开资料，图片分别说明一个主题，再承接购买</text>
<text x="20" y="3089" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">与互动信息。</text>
<text x="20" y="3139" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#a65336">查看上新文章30页全文</text>
<path d="M20,3203 L370,3203" stroke="#cdd2c7"/>
<text x="20" y="3255" font-family="Noto Serif SC,Songti SC,serif" font-size="25" font-weight="600" fill="#26382f">项目结果与我的贡献</text>
<text x="20" y="3305" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">洁面上新 GMV 80万+。 这是项目整体成果，没</text>
<text x="20" y="3335" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">有单篇文章、某张海报或个人内容的销售归</text>
<text x="20" y="3365" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">因；现有确认未限定为一个月。</text>
<text x="20" y="3415" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">这一案呈现的是选择主张与压缩表达：先用两</text>
<text x="20" y="3445" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">句短话建立重点，再为成分、肤感和长文安排</text>
<text x="20" y="3475" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">不同的信息量。</text>
<path d="M20,3534 L370,3534" stroke="#cdd2c7"/>
<text x="20" y="3586" font-family="Noto Serif SC,Songti SC,serif" font-size="25" font-weight="600" fill="#26382f">完整作品与补充阅读</text>
<text x="20" y="3636" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">以下两组对照与清洁感海报继续保留，不必逐</text>
<text x="20" y="3666" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">张读完也能理解主线。</text>
<path d="M20,3699 L370,3699" stroke="#cdd2c7"/>
<text x="20" y="3735" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#26382f">成分分组：把名称和说明逐组对应</text>
<text x="20" y="3768" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#a65336">1组 · 线稿／成品   展开查看 ＋</text>
<path d="M20,3798 L370,3798" stroke="#cdd2c7"/>
<text x="20" y="3834" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#26382f">肤感表达：总标题之后，保留三个短标签</text>
<text x="20" y="3867" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#a65336">1组 · 线稿／成品   展开查看 ＋</text>
<path d="M20,3897 L370,3897" stroke="#cdd2c7"/>
<text x="20" y="3933" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#26382f">清洁感海报与完整线稿</text>
<text x="20" y="3966" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#a65336">1幅海报＋3页线稿PDF   展开查看 ＋</text>
<text x="20" y="4035" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="15" font-weight="400" fill="#46534a">图文中的配方、功效与体验按历史作品保留。“睁眼</text>
<text x="20" y="4062" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="15" font-weight="400" fill="#46534a">洗”等是历史传播表达，不作为当前使用建议或本轮</text>
<text x="20" y="4089" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="15" font-weight="400" fill="#46534a">核验的测试结论。</text>
