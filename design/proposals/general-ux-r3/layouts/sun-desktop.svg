<text x="248" y="1169" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">先承接顾虑，再把比较维度转到护理组合，随后展开资料。话术用于一对一、群内介绍及销售培</text>
