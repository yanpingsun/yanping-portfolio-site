<text x="248" y="1482" font-family="Noto Serif SC,Songti SC,serif" font-size="36" font-weight="600" fill="#26382f">“1支防晒半支精华，外防光老化，内养冷白皮”。</text>
<text x="248" y="1544" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">这句话建立当时的护理价值参照；“半支精华”是传播表达，不是配方比例。</text>
<text x="248" y="1596" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">护理信息越丰富，越需要接住使用负担的疑问。我将价值说明与轻薄、贴肤、跟妆分开组织，让</text>
<text x="248" y="1628" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">“为什么关注”和“用起来怎样”都有明确内容。</text>
<text x="248" y="1703" font-family="Noto Serif SC,Songti SC,serif" font-size="23" font-weight="600" fill="#26382f">养肤价值：把每组资料与各自描述配对</text>
<text x="248" y="1752" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">总标题之下安排透亮、细腻、嘭弹、滑嫩四组信息。原图中的数值保留“使用4周、受试者自评</text>
