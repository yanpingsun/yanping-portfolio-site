<text x="248" y="254" font-family="Noto Serif SC,Songti SC,serif" font-size="40" font-weight="600" fill="#26382f">让粉丝兴趣</text>
<text x="248" y="313" font-family="Noto Serif SC,Songti SC,serif" font-size="40" font-weight="600" fill="#26382f">有具体的参与入口</text>
<text x="248" y="374" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">在官方新媒体工作中，我独立负责微博内容与活动，管理两位</text>
<text x="248" y="406" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">专员，统筹其他平台的内容及脚本审核。工作的重点是组织参</text>
<text x="248" y="438" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">与理由、入口与内容，并协调产品和运营资源落地。</text>
<text x="248" y="488" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">我的工作：内容与活动策划、资源沟通、团队管理及统筹审核。 技术</text>
<text x="248" y="516" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">开发与产品实现由相关团队负责；其他平台的制作、剪辑按团队分工</text>
<text x="248" y="544" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">完成。</text>
