<text x="248" y="2046" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#46534a">历史阶段记录：累计参与8万人次，拉新及促活2.2万人次。 具体统计周期尚待补充，不归为上</text>
