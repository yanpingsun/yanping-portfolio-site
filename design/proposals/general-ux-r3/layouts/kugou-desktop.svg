<text x="248" y="4244" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">微博从新歌、品牌节点、明星生日到热点和活动内容，由我独立策划并推进。其他平台通过方</text>
<text x="248" y="4276" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">向、选题和脚本／内容审核组织团队工作，管理两位专员承担相关制作与剪辑。</text>
<text x="248" y="4328" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">发糖机体现参与机制与资源沟通，音效内容体现渠道改写与审核，电台体现栏目组织及持续协</text>
<text x="248" y="4360" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">作。活动参与、话题浏览、合集播放、阅读和互动分别看待，不能合计为个人创造的一个总成</text>
<text x="248" y="4392" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">绩。</text>
