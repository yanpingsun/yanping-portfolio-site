<text x="248" y="853" font-family="Noto Serif SC,Songti SC,serif" font-size="30" font-weight="600" fill="#26382f">发糖机：把艺人节点写成可执行的参与内容</text>
<text x="248" y="906" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">账号已有品牌积累、增粉趋缓后，内容还需要承接客户端拉新与促活。我根据微博可合作资源提</text>
<text x="248" y="938" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">出跳转合作思路，与产品经理、APP运营沟通，将站外音乐兴趣连接到站内内容。</text>
<text x="248" y="990" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">围绕粉丝的签到、打榜与互动习惯，我策划“胖汪发糖机”H5，组织主题、福利、规则及传播</text>
<text x="248" y="1022" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">内容，并协调产品与设计落地，后续形成月度固定活动。</text>
<text x="248" y="1097" font-family="Noto Serif SC,Songti SC,serif" font-size="23" font-weight="600" fill="#26382f">一个期次：入口和奖励各自说清</text>
<text x="248" y="1146" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">2022年11月23日，时代少年团“三时有声”周年企划的发布微博给出网页链接与客户端搜索口</text>
<text x="248" y="1178" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">令。微博交代参与理由与入口，活动长图继续解释主题和奖励。</text>
<text x="248" y="1230" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">该期将第66、666、1123、6666名参与者与相应福利配对，指定参与序号对应奖励；这不是所有</text>
<text x="248" y="1262" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">发糖机的统一机制。</text>
