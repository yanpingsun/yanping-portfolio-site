<text x="248" y="456" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">我的工作：卖点与多渠道内容策划、文案及三条视频脚本；参与直播</text>
<text x="248" y="484" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">话术讨论并制定产品讲解内容。 视觉由设计师制作，视频拍摄、剪辑</text>
<text x="248" y="512" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">和商务由相关团队或合作方完成。</text>
<text x="248" y="560" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="500" fill="#26382f">项目整体结果：童颜面膜上新 GMV 100万+，由团队及渠道共同完</text>
