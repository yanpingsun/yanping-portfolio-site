<text x="20" y="409" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">平台官方运营，随后聚焦护肤品新品内容。</text>
<text x="20" y="459" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">在护肤品项目中，我梳理卖点，撰写长文、图</text>
<text x="20" y="489" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">文文案与视频脚本，安排详情页内容，并与设</text>
<text x="20" y="519" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">计、产品、运营和销售团队配合。在酷狗音</text>
<text x="20" y="549" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">乐，我独立负责微博内容及活动，管理两位专</text>
<text x="20" y="579" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#46534a">员，统筹其他平台的内容和脚本审核。</text>
<path d="M20,638 L370,638" stroke="#cdd2c7"/>
<text x="20" y="690" font-family="Noto Serif SC,Songti SC,serif" font-size="25" font-weight="600" fill="#26382f">我怎样推进内容</text>
<text x="20" y="740" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">先选择沟通重点。 精华油需要同时讲清共同特</text>
<text x="20" y="770" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">点和日夜区别；防晒需要兼顾价格解释与肤感</text>
<text x="20" y="800" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">顾虑。先确定这一次要回答什么，再组织资</text>
<text x="20" y="830" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">料。</text>
<text x="20" y="880" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">让不同形式承担不同任务。 海报留下一个理</text>
<text x="20" y="910" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">由，长文继续解释，话术回应具体问题，人物</text>
<text x="20" y="940" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">视频需要有自然的转场。作品中可以继续查看</text>
<text x="20" y="970" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">这些取舍及对应原件。</text>
<text x="20" y="1020" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">把分工落实到交付。 独立撰写、统筹审核和协</text>
<text x="20" y="1050" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">同制作在案例中分别说明；视觉设计、产品实</text>
<text x="20" y="1080" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="500" fill="#46534a">现及拍摄剪辑按实际团队分工呈现。</text>
<text x="20" y="1130" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#a65336">看产品内容案例 · 看内容运营案例</text>
