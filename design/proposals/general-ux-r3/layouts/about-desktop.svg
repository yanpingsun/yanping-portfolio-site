<text x="192" y="1941" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">三江学院｜国际旅游管理本科，2010—2014。</text>
<text x="192" y="1993" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">韩国语 TOPIK 6级。</text>
