<text x="64" y="71" font-family="Noto Serif SC,Songti SC,serif" font-size="24" font-weight="600" fill="#26382f">孙岩萍</text>
<text x="976" y="69" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="15" font-weight="400" fill="#26382f">作品   关于   简历 ↗</text>
<path d="M64,98 L1216,98" stroke="#cdd2c7"/>
<text x="192" y="174" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="22" font-weight="400" fill="#26382f">孙岩萍</text>
<text x="192" y="242" font-family="Noto Serif SC,Songti SC,serif" font-size="44" font-weight="600" fill="#26382f">产品内容策划与新媒体运营</text>
<text x="192" y="306" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">我的工作连接两类内容任务：为产品选择清楚的表达，也为用户组织具体的参与理由。经历从新</text>
<text x="192" y="338" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">媒体编辑与品牌本地化内容，延伸到音乐平台官方运营，随后聚焦护肤品新品内容。</text>
<text x="192" y="390" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">在护肤品项目中，我梳理卖点，撰写长文、图文文案与视频脚本，安排详情页内容，并与设计、</text>
<text x="192" y="422" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">产品、运营和销售团队配合。在酷狗音乐，我独立负责微博内容及活动，管理两位专员，统筹其</text>
<text x="192" y="454" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">他平台的内容和脚本审核。</text>
<path d="M192,514 L1216,514" stroke="#cdd2c7"/>
<text x="192" y="571" font-family="Noto Serif SC,Songti SC,serif" font-size="30" font-weight="600" fill="#26382f">我怎样推进内容</text>
<text x="192" y="624" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#46534a">先选择沟通重点。 精华油需要同时讲清共同特点和日夜区别；防晒需要兼顾价格解释与肤感顾</text>
<text x="192" y="656" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#46534a">虑。先确定这一次要回答什么，再组织资料。</text>
<text x="192" y="708" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#46534a">让不同形式承担不同任务。 海报留下一个理由，长文继续解释，话术回应具体问题，人物视频</text>
<text x="192" y="740" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#46534a">需要有自然的转场。作品中可以继续查看这些取舍及对应原件。</text>
<text x="192" y="792" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#46534a">把分工落实到交付。 独立撰写、统筹审核和协同制作在案例中分别说明；视觉设计、产品实现</text>
<text x="192" y="824" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="500" fill="#46534a">及拍摄剪辑按实际团队分工呈现。</text>
<text x="192" y="876" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#a65336">看产品内容案例 · 看内容运营案例</text>
<path d="M192,941 L1216,941" stroke="#cdd2c7"/>
<text x="192" y="998" font-family="Noto Serif SC,Songti SC,serif" font-size="30" font-weight="600" fill="#26382f">工作经历</text>
<text x="192" y="1074" font-family="Noto Serif SC,Songti SC,serif" font-size="23" font-weight="600" fill="#26382f">广州无添加主义化妆品有限公司｜企划（产品内容方向）</text>
<text x="192" y="1121" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="400" fill="#26382f">2024.03—2026.09</text>
<text x="192" y="1171" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">参与精华油、防晒、面膜、洁面等产品内容及上市传播，完成卖点、长图文、脚本与销售沟通等</text>
<text x="192" y="1203" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">内容工作。</text>
<text x="192" y="1278" font-family="Noto Serif SC,Songti SC,serif" font-size="23" font-weight="600" fill="#26382f">广州酷狗计算机科技有限公司｜新媒体运营经理</text>
<text x="192" y="1325" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="400" fill="#26382f">2019.06—2024.01</text>
<text x="192" y="1375" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">负责官方新媒体内容、活动策划与多平台统筹，推进内容、粉丝互动和客户端参与之间的连接。</text>
<text x="192" y="1450" font-family="Noto Serif SC,Songti SC,serif" font-size="23" font-weight="600" fill="#26382f">China Marketing Development Center 首尔分部｜新媒体运营</text>
<text x="192" y="1497" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="400" fill="#26382f">2018.02—2019.04</text>
<text x="192" y="1547" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">参与韩国品牌在中国市场的本地化内容及小红书种草项目执行。</text>
<text x="192" y="1622" font-family="Noto Serif SC,Songti SC,serif" font-size="23" font-weight="600" fill="#26382f">上海沪江网教育技术有限公司｜新媒体编辑</text>
<text x="192" y="1669" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="16" font-weight="400" fill="#26382f">2017.01—2018.01</text>
<text x="192" y="1719" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="18" font-weight="400" fill="#46534a">围绕韩语学习需求、活动与课程推广组织新媒体选题和表达。</text>
