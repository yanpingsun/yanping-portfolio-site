<text x="64" y="202" font-family="Noto Serif SC,Songti SC,serif" font-size="22" font-weight="600" fill="#26382f">我是孙岩萍</text>
<text x="64" y="252" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">产品内容策划 · 新媒体运营</text>
<text x="64" y="342" font-family="Noto Serif SC,Songti SC,serif" font-size="58" font-weight="600" fill="#26382f">讲清产品价值，</text>
<text x="64" y="429" font-family="Noto Serif SC,Songti SC,serif" font-size="58" font-weight="600" fill="#26382f">也让用户愿意参与。</text>
<text x="64" y="500" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">在护肤品项目中，我梳理产品卖点，写上新长文、图文文案和视频脚本；在酷狗音乐，我负责官</text>
<text x="64" y="532" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">方新媒体内容、粉丝活动和多平台统筹。以下五个项目呈现具体的策划判断、作品与协作分工。</text>
<text x="64" y="582" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#a65336">看代表项目 · 查看简历</text>
<path d="M64,634 L1216,634" stroke="#cdd2c7"/>
<text x="64" y="678" font-family="Noto Serif SC,Songti SC,serif" font-size="30" font-weight="600" fill="#26382f">代表项目</text>
<image href="../../portfolio-content/essence-oil/assets/posters/oil-product.png" x="64.0" y="714" width="560" height="220" preserveAspectRatio="xMidYMid slice"/>
<text x="64.0" y="1017" font-family="Noto Serif SC,Songti SC,serif" font-size="23" font-weight="600" fill="#26382f">日夜精华油｜为双产品建立一条内容主线</text>
<text x="64.0" y="1068" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">日用、夜用两款产品，怎样让人看懂共同特点和各自用途？从卖点提</text>
<text x="64.0" y="1100" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">炼、海报内容结构到公众号、朋友圈和四类视频脚本，展示一条主线如</text>
<text x="64.0" y="1132" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">何展开。</text>
<text x="64.0" y="1182" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">我的工作：卖点梳理、文案、图文结构与视频脚本。</text>
<text x="64.0" y="1232" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#a65336">查看精华油案例</text>
<image href="../../portfolio-content/kugou/assets/weibo/fatang-weibo.jpg" x="656.0" y="714" width="560" height="220" preserveAspectRatio="xMidYMid slice"/>
<text x="656.0" y="1017" font-family="Noto Serif SC,Songti SC,serif" font-size="23" font-weight="600" fill="#26382f">酷狗音乐｜把粉丝互动连接到客户端参与</text>
<text x="656.0" y="1068" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">围绕艺人主题、活动入口和奖励规则组织发糖机活动，再结合五个平台</text>
<text x="656.0" y="1100" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">与电台栏目作品，展示内容策划、资源沟通和团队统筹的实际工作。</text>
<text x="656.0" y="1150" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">我的工作：内容与活动策划、资源沟通、团队管理与统筹审核。</text>
<text x="656.0" y="1200" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#a65336">查看酷狗案例</text>
<path d="M64,1310 L1216,1310" stroke="#cdd2c7"/>
<text x="64" y="1354" font-family="Noto Serif SC,Songti SC,serif" font-size="30" font-weight="600" fill="#26382f">更多项目，展开不同的内容问题</text>
<text x="64" y="1408" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">童颜面膜｜旧品认知之上，讲清升级价值</text>
<text x="64" y="1458" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">承接成熟产品认知，用升级差异、双膜结构、故事脚本与直播讲解，为新版组织选择理由。</text>
<text x="64" y="1508" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#a65336">查看面膜案例</text>
<text x="64" y="1558" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">高客单防晒｜解释护理价值，也回应肤感顾虑</text>
<text x="64" y="1608" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">把“为什么值得关注”和“会不会厚重、搓泥”分别写清，让价值表达与具体使用问题相互承</text>
<text x="64" y="1640" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">接。</text>
<text x="64" y="1690" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#a65336">查看防晒案例</text>
<text x="64" y="1740" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">逆时光洁颜霜｜一句话回应两种使用顾虑</text>
<text x="64" y="1790" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">以“油皮洗得净，干皮不紧绷”的历史文案，结合三组结构对照，展示卖点怎样进入海报与完整</text>
<text x="64" y="1822" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">上新文章。</text>
<text x="64" y="1872" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#a65336">查看洁面案例</text>
<path d="M64,1924 L1216,1924" stroke="#cdd2c7"/>
<text x="64" y="1968" font-family="Noto Serif SC,Songti SC,serif" font-size="30" font-weight="600" fill="#26382f">我的经历</text>
<text x="64" y="2022" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">最近一段工作聚焦护肤品产品内容与新品上市策划；此前在酷狗音乐负责官方新媒体运营。更早</text>
<text x="64" y="2054" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#46534a">参与过品牌本地化内容与韩语学习相关的新媒体编辑工作。</text>
